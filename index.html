<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فروشگاه بافتنی هلو 🍑</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#fff7f2;
color:#333;
}

/* HEADER */

header{
background:linear-gradient(135deg,#ff9966,#ff5f8f);
color:white;
padding:25px 15px;
text-align:center;
box-shadow:0 4px 15px #0002;
}

header h1{
margin:0;
font-size:30px;
}

header p{
margin:8px 0 0;
}

/* MENU */

.menu{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

.menu button{
border:0;
background:white;
color:#e85d75;
padding:12px 20px;
border-radius:15px;
font-family:inherit;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

/* CONTAINER */

.container{
max-width:1100px;
margin:auto;
padding:25px 15px;
}

.title{
text-align:center;
margin-bottom:25px;
}

/* PRODUCTS */

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:18px;
}

.product{
background:white;
border-radius:20px;
padding:18px;
text-align:center;
box-shadow:0 4px 15px #0001;
transition:.2s;
}

.product:hover{
transform:translateY(-5px);
}

.emoji{
font-size:65px;
}

.product h2{
font-size:19px;
margin:10px 0;
}

.price{
color:#e85d75;
font-size:17px;
font-weight:bold;
margin:10px 0;
}

.add{
border:0;
background:#ff7191;
color:white;
padding:11px 20px;
border-radius:12px;
font-family:inherit;
cursor:pointer;
}

/* MODAL */

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:100;
padding:20px;
}

.modal-box{
background:white;
max-width:520px;
margin:40px auto;
border-radius:20px;
padding:22px;
max-height:85vh;
overflow:auto;
}

.close{
float:left;
border:0;
background:#eee;
padding:7px 12px;
border-radius:10px;
cursor:pointer;
}

/* CART */

.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
border-bottom:1px solid #eee;
padding:14px 0;
}

.qty{
display:flex;
align-items:center;
gap:8px;
}

.qty button{
border:0;
background:#ff7191;
color:white;
width:30px;
height:30px;
border-radius:8px;
cursor:pointer;
}

.delete{
border:0;
background:#ff4d4d;
color:white;
padding:7px 10px;
border-radius:8px;
cursor:pointer;
}

.total{
font-size:20px;
font-weight:bold;
color:#e85d75;
margin:20px 0;
}

.invoice{
width:100%;
border:0;
background:#6c63ff;
color:white;
padding:14px;
border-radius:13px;
font-family:inherit;
font-size:16px;
cursor:pointer;
}

/* PHONE */

.phone{
background:#fff0e8;
padding:20px;
border-radius:15px;
text-align:center;
margin-top:15px;
}

.phone a{
display:inline-block;
margin-top:10px;
color:#e85d75;
font-size:23px;
font-weight:bold;
text-decoration:none;
}
