<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروشگاه بافتنی هلو 🍑</title>

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #fff4f7;
      color: #333;
      text-align: center;
    }

    header {
      background: #ff8fab;
      color: white;
      padding: 35px 15px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      margin-top: 12px;
      font-size: 17px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .product {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px #00000015;
    }

    .emoji {
      font-size: 55px;
    }

    .product h2 {
      font-size: 20px;
    }

    .price {
      color: #e84a70;
      font-weight: bold;
      margin: 12px;
    }

    button {
      background: #ff6f91;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    footer {
      background: #333;
      color: white;
      padding: 20px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🍑 فروشگاه بافتنی هلو</h1>
    <div class="subtitle">
      محصولات دست‌ساز بافتنی با عشق ❤️
    </div>
  </header>

  <h2>🧶 محصولات ما</h2>

  <div class="products">

    <div class="product">
      <div class="emoji">🥭</div>
      <h2>جاکلیدی انبه</h2>
      <div class="price">۶۰٬۰۰۰ تومان</div>
      <button onclick="alert('جاکلیدی انبه به سبد خرید اضافه شد 🛒')">
        افزودن به سبد
      </button>
    </div>

    <div class="product">
      <div class="emoji">🍊</div>
      <h2>جاکلیدی نارنگی</h2>
      <div class="price">۶۰٬۰۰۰ تومان</div>
      <button onclick="alert('جاکلیدی نارنگی به سبد خرید اضافه شد 🛒')">
        افزودن به سبد
      </button>
    </div>

    <div class="product">
      <div class="emoji">🐰</div>
      <h2>جاکلیدی خرگوش</h2>
      <div class="price">۱۲۰٬۰۰۰ تومان</div>
      <button onclick="alert('جاکلیدی خرگوش به سبد خرید اضافه شد 🛒')">
        افزودن به سبد
      </button>
    </div>

    <div class="product">
      <div class="emoji">🐢</div>
      <h2>جاکلیدی لاک‌پشت</h2>
      <div class="price">۱۲۰٬۰۰۰ تومان</div>
      <button onclick="alert('جاکلیدی لاک‌پشت به سبد خرید اضافه شد 🛒')">
        افزودن به سبد
      </button>
    </div>

    <div class="product">
      <div class="emoji">🐸</div>
      <h2>جاکلیدی قورباغه</h2>
      <div class="price">۱۲۰٬۰۰۰ تومان</div>
      <button onclick="alert('جاکلیدی قورباغه به سبد خرید اضافه شد 🛒')">
        افزودن به سبد
      </button>
    </div>

    <div class="product">
      <div class="emoji">💖</div>
      <h2>دستبند بافتنی</h2>
      <div class="price">۲۹٬۰۰۰ تومان</div>
      <button onclick="alert('دستبند به سبد خرید اضافه شد 🛒')">
        افزودن به سبد
      </button>
    </div>

  </div>

  <footer>
    🍑 فروشگاه بافتنی هلو 🍑
  </footer>

</body>
</html>
