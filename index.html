<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فروشگاه بافتنی هلو 🍑</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#fff7fa;
    color:#333;
}

header{
    background:linear-gradient(135deg,#ff6f9c,#ff9fbb,#79c4ff);
    color:white;
    text-align:center;
    padding:28px 15px;
}

header h1{
    margin:0 0 10px;
    font-size:30px;
}

header p{
    margin:0 0 20px;
}

.menu{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.menu button{
    border:0;
    padding:12px 18px;
    border-radius:12px;
    background:white;
    color:#e94f7d;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 15px;
}

.title{
    text-align:center;
    color:#e94f7d;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:18px;
}

.product{
    background:white;
    border:2px solid #ffe0ea;
    border-radius:18px;
    padding:18px;
    text-align:center;
    box-shadow:0 4px 12px #0001;
}

.product-icon{
    font-size:60px;
}

.product h3{
    font-size:17px;
}

.price{
    color:#e94f7d;
    font-weight:bold;
    margin:12px 0;
}

.product button{
    width:100%;
    border:0;
    padding:11px;
    border-radius:10px;
    color:white;
    font-weight:bold;
    background:linear-gradient(90deg,#ff6f9c,#72bfff);
    cursor:pointer;
}

.creator{
    margin-top:30px;
    text-align:center;
    padding:18px;
    border-radius:15px;
    background:linear-gradient(90deg,#fff0f5,#edf8ff);
    font-weight:bold;
}

.creator-name{
    color:#e94f7d;
    font-size:19px;
}

footer{
    margin-top:40px;
    padding:30px 15px;
    text-align:center;
    color:white;
    background:linear-gradient(135deg,#ff6f9c,#79c4ff);
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:#0008;
    padding:15px;
    overflow:auto;
}

.modal-box{
    position:relative;
    max-width:600px;
    margin:35px auto;
    padding:25px;
    background:white;
    border-radius:20px;
    border-top:6px solid #ff7198;
    border-bottom:6px solid #79c4ff;
}

.close{
    position:absolute;
    left:12px;
    top:12px;
    border:0;
    width:35px;
    height:35px;
    border-radius:50%;
    cursor:pointer;
}

.modal-box h2{
    text-align:center;
    color:#e94f7d;
}

.cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.cart-name{
    flex:1;
    font-weight:bold;
}
