<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فروشگاه بافتنی هلو 🍑</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#fff7fa;
    color:#333;
}

/* هدر */

header{
    background:linear-gradient(135deg,#ff8fb1,#ffb5ca,#8fcfff);
    color:white;
    text-align:center;
    padding:30px 15px;
    box-shadow:0 3px 12px #0002;
}

header h1{
    margin:0 0 10px;
    font-size:30px;
}

header p{
    margin:0 0 20px;
    font-size:16px;
}

.menu{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.menu button{
    border:none;
    background:white;
    color:#e94f7d;
    padding:12px 18px;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 8px #0002;
}

.menu button:hover{
    background:#eef8ff;
    color:#378bd1;
}

/* محصولات */

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 15px;
}

.title{
    text-align:center;
    color:#e94f7d;
    margin-bottom:25px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:18px;
}

.product{
    background:white;
    border-radius:18px;
    padding:18px;
    text-align:center;
    box-shadow:0 4px 12px #0001;
    transition:.2s;
    border:2px solid #ffe0ea;
}

.product:hover{
    transform:translateY(-4px);
    border-color:#9bd5ff;
}

.product-icon{
    font-size:65px;
    margin-bottom:10px;
}

.product h3{
    margin:8px 0;
    font-size:17px;
}

.price{
    color:#e94f7d;
    font-weight:bold;
    margin:10px 0;
}

.product button{
    width:100%;
    border:none;
    background:linear-gradient(90deg,#ff7198,#72bfff);
    color:white;
    padding:11px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.product button:hover{
    opacity:.85;
}

/* پنجره‌ها */

.modal{
    display:none;
    position:fixed;
    z-index:1000;
    inset:0;
    background:#0008;
    padding:20px;
    overflow:auto;
}

.modal-box{
    background:white;
    max-width:600px;
    margin:40px auto;
    padding:25px;
    border-radius:20px;
    position:relative;
    border-top:6px solid #ff7198;
    border-bottom:6px solid #8fcfff;
}

.close{
    position:absolute;
    left:15px;
    top:12px;
    border:none;
    background:#eee;
    border-radius:50%;
    width:35px;
    height:35px;
    cursor:pointer;
    font-size:17px;
}

.modal-box h2{
    text-align:center;
    color:#e94f7d;
}

/* سبد */

.cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.cart-name{
    flex:1;
    font-weight:bold;
}

.qty{
    display:flex;
    align-items:center;
    gap:7px;
}

.qty button{
    border:none;
    background:#72bfff;
    color:white;
    width:30px;
    height:30px;
    border-radius:8px;
    cursor:pointer;
}

.remove{
    border:none;
    background:#ffe0e8;
    color:#d33;
    padding:7px;
    border-radius:8px;
    cursor:pointer;
}

.total{
    margin-top:20px;
    padding:15px;
    background:linear-gradient(90deg,#fff0f5,#edf8ff);
    border-radius:12px;
    text-align:center;
    font-weight:bold;
    color:#d94170;
}

.invoice{
    width:100%;
    margin-top:15px;
    border:none;
    background:#72aef0;
    color:white;
    padding:13px;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.invoice:hover{
    background:#518fd2;
}

/* تماس */

.phone{
    background:linear-gradient(135deg,#fff0f5,#edf8ff);
    padding:18px;
    text-align:center;
    border-radius:15px;
    margin-top:20px;
}

.phone a{
    color:#378bd1;
    font-size:22px;
    font-weight:bold;
    text-decoration:none;
}

/* فاکتور */

.invoice-box{
    background:white;
    border:3px solid #ff8fb1;
    border-radius:18px;
    padding:25px;
    margin-top:20px;
    box-shadow:0 4px 15px #0001;
}

.invoice-title{
    text-align:center;
    color:#e94f7d;
    font-size:25px;
    font-weight:bold;
    margin-bottom:20px;
}

.invoice-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.invoice-total{
    margin-top:20px;
    background:linear-gradient(90deg,#fff0f5,#edf8ff);
    padding:15px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
    color:#d94170;
}

.invoice-phone{
    text-align:center;
    margin-top:20px;
    padding:15px;
    background:#edf8ff;
    border-radius:12px;
}

.invoice-message{
    margin-top:15px;
    padding:15px;
    background:#fff8d9;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
    line-height:1.8;
}

/* دانلود */

.download-btn{
    width:100%;
    margin-top:15px;
    border:none;
    background:linear-gradient(90deg,#ff7198,#72bfff);
    color:white;
    padding:14px;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.download-btn:hover{
    opacity:.85;
}

.screenshot-message{
    text-align:center;
    margin-top:12px;
    color:#555;
    font-size:14px;
    line-height:1.8;
}

/* سازنده */

.creator{
    margin-top:25px;
    padding:15px;
    text-align:center;
    background:linear-gradient(90deg,#fff0f5,#edf8ff);
    border-radius:15px;
    font-weight:bold;
}

.creator span{
    color:#e94f7d;
}

/* فوتر */

footer{
    margin-top:40px;
    background:linear-gradient(135deg,#ff7198,#8fcfff);
    color:white;
    text-align:center;
    padding:30px 15px;
}

/* موبایل */

@media(max-width:600px){

    header h1{
        font-size:25px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .product{
        padding:12px;
    }

    .product-icon{
        font-size:50px;
    }

    .product h3{
        font-size:14px;
    }

    .price{
        font-size:14px;
    }

    .cart-item{
        flex-wrap:wrap;
    }

    .modal-box{
        margin:20px auto;
        padding:18px;
    }
}

</style>
</head>

<body>

<h1>🍑 فروشگاه بافتنی هلو</h1>

<p>محصولات بافتنی دست‌ساز با عشق 💕</p>

<button onclick="openCart()">
