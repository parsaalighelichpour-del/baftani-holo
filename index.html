<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍑 فروشگاه بافتنی هلو</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#fff5f8;
  color:#333;
}

header{
  background:linear-gradient(135deg,#ff8fb1,#ffb6c9);
  color:white;
  padding:25px 15px;
  text-align:center;
}

header h1{
  margin:0 0 8px;
}

header p{
  margin:5px 0 15px;
}

nav{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.nav-btn,
.main-btn,
.secondary-btn{
  padding:10px 15px;
  border-radius:12px;
  background:white;
  color:#d52f68;
  font-weight:bold;
}

.main-btn{
  background:#d52f68;
  color:white;
}

.secondary-btn{
  background:#eee;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:white;
  border-radius:18px;
  padding:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  text-align:center;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.product-image{
  width:100%;
  height:190px;
  object-fit:cover;
  border-radius:14px;
}

.emoji{
  font-size:100px;
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff4f7;
  border-radius:14px;
}

.price{
  color:#d52f68;
  font-weight:bold;
  margin:10px 0;
}

.add{
  background:#ff75a0;
  color:white;
  padding:10px 15px;
  border-radius:10px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  justify-content:center;
  align-items:center;
  padding:15px;
  z-index:10;
}

.modal-content{
  background:white;
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  border-radius:20px;
  padding:20px;
  position:relative;
}

.close{
  position:absolute;
  left:15px;
  top:10px;
  font-size:25px;
  background:none;
}

.detail-image{
  width:100%;
  max-height:350px;
  object-fit:cover;
  border-radius:15px;
}

.input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:7px 0;
  font-family:inherit;
}

.cart-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-bottom:1px solid #eee;
}

.cart-item img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
}

.cart-info{
  flex:1;
}

.quantity{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}

.quantity button{
  width:30px;
  height:30px;
  border-radius:8px;
  background:#ffd5e2;
}

.remove{
  background:#ffe0e0;
  border-radius:8px;
  padding:7px;
}

.invoice-line{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.empty{
  text-align:center;
  padding:20px;
  color:#888;
}

.vip{
  background:#fff0a8;
  padding:10px;
  border-radius:10px;
  margin:10px 0;
  font-weight:bold;
}

.comments{

  border-top:2px solid #ffd4e3;

}

.comments h3{
  color:#d52f68;
  margin-bottom:10px;

.comment-box{

  margin:8px 0;
  line-height:1.8;
}

.comment-name{

footer{

  color:white;

let cart =
  JSON.parse(localStorage.getItem("heloCart")) || [];

let currentProduct = null;


/* نمایش محصولات */

function renderProducts(){

  const box =
    document.getElementById("products");

  box.innerHTML = "";

  products.forEach(p=>{

    box.innerHTML += `

      <div
        class="card"
        onclick="openProduct(${p.id})">

        <img
          class="product-image"
          src="${p.image}"
          alt="${p.name}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
        >

        <div
          class="emoji"
          style="display:none">

          ${p.emoji}

        </div>

        <h3>${p.name}</h3>

        <div class="price">
          ${formatPrice(p.price)} تومان
        </div>

        <button
          class="add"
          onclick="event.stopPropagation(); addToCart(${p.id})">

          🛒 افزودن به سبد

        </button>

      </div>

    `;

  });

}


/* قیمت */

function formatPrice(number){

  return number.toLocaleString("fa-IR");

}


/* باز کردن جزئیات */

function openProduct(id){

  currentProduct =
    products.find(p=>p.id===id);

  if(!currentProduct) return;

  document.getElementById("detailName").innerText =
    currentProduct.emoji + " " +
    currentProduct.name;

  document.getElementById("detailImage").src =
    currentProduct.image;

  document.getElementById("detailPrice").innerText =
    formatPrice(currentProduct.price) +
    " تومان";

  document.getElementById("detailText").innerText =
    currentProduct.description;

  renderComments(currentProduct.id);

  document.getElementById("productModal").style.display="flex";

}


/* افزودن از جزئیات */

function addDetailToCart(){

  if(currentProduct){

    addToCart(currentProduct.id);

    closeModal("productModal");

  }

}


/* بررسی حساب */

function requireLogin(){

  const user =
    JSON.parse(localStorage.getItem("heloUser"));

  if(!user){

    document.getElementById("loginModal").style.display="flex";

    return false;

  }

  return true;

}


/* افزودن به سبد */

function addToCart(id){

  if(!requireLogin()) return;

  const product =
    products.find(p=>p.id===id);

  if(!product) return;

  const existing =
    cart.find(item=>item.id===id);

  if(existing){

    existing.qty++;

  }else{

    cart.push({
      id:id,
      qty:1
    });

  }

  saveCart();

  alert("✅ محصول به سبد خرید اضافه شد!");

}


/* ذخیره */

function saveCart(){

  localStorage.setItem(
    "heloCart",
    JSON.stringify(cart)
  );

  updateCartCount();

}


/* تعداد سبد */

function updateCartCount(){

  let count =
    cart.reduce(
      (sum,item)=>sum+item.qty,
      0
    );

  document.getElementById("cartCount").innerText =
    formatPrice(count);

}


/* باز کردن سبد */

function openCart(){

  if(!requireLogin()) return;

  renderCart();

  document.getElementById("cartModal").style.display="flex";

}


/* نمایش سبد */

function renderCart(){

  const box =
    document.getElementById("cartItems");

  if(cart.length===0){

    box.innerHTML =
      `<div class="empty">🛒 سبد خرید خالی است.</div>`;

    document.getElementById("cartTotal").innerText="۰";

    return;

  }

  let html="";
  let total=0;

  cart.forEach(item=>{

    const p =
      products.find(x=>x.id===item.id);

    if(!p) return;

    const itemTotal =
      p.price*item.qty;

    total+=itemTotal;

    html+=`

      <div class="cart-item">

        <img src="${p.image}">

        <div class="cart-info">

          <b>
            ${p.emoji} ${p.name}
          </b>

          <div>
            ${formatPrice(p.price)} تومان
          </div>

          <div class="quantity">

            <button
              onclick="changeQty(${p.id},1)">
              +
            </button>

            <span>${item.qty}</span>

            <button
              onclick="changeQty(${p.id},-1)">
              −
            </button>

          </div>

        </div>

        <button
          class="remove"
          onclick="removeFromCart(${p.id})">

          🗑️

        </button>

      </div>

    `;

  });

  box.innerHTML=html;

  document.getElementById("cartTotal").innerText =
    formatPrice(total);

}


/* تغییر تعداد */

function changeQty(id,change){

  const item =
    cart.find(x=>x.id===id);

  if(!item) return;

  item.qty+=change;

  if(item.qty<=0){

    cart =
      cart.filter(x=>x.id!==id);

  }

  saveCart();

  renderCart();

}


/* حذف */

function removeFromCart(id){

  cart =
    cart.filter(x=>x.id!==id);

  saveCart();

  renderCart();

}


/* ساخت فاکتور */

function createInvoice(){

  if(cart.length===0){

    alert("🛒 سبد خرید خالی است!");

    return;

  }

  const user =
    JSON.parse(localStorage.getItem("heloUser"));

  let html="";
  let total=0;

  cart.forEach(item=>{

    const p =
      products.find(x=>x.id===item.id);

    if(!p) return;

    const amount =
      p.price*item.qty;

    total+=amount;

    html+=`

      <div class="invoice-line">

        <span>
          ${p.emoji} ${p.name} × ${item.qty}
        </span>

        <span>
          ${formatPrice(amount)} تومان
        </span>

      </div>

    `;

  });

  document.getElementById("invoiceProducts").innerHTML =
    html;

  document.getElementById("invoiceTotal").innerText =
    formatPrice(total)+" تومان";

  document.getElementById("invoiceCustomer").innerText =
    user ? user.name : "مشتری";

  sendOrderEmail(user,total);

  closeModal("cartModal");

  document.getElementById("invoiceModal").style.display="flex";

}


/* ارسال سفارش به ایمیل */

function sendOrderEmail(user,total){

  let productText="";

  cart.forEach(item=>{

    const p =
      products.find(x=>x.id===item.id);

    if(p){

      productText +=
        `${p.name} × ${item.qty} = ${formatPrice(p.price*item.qty)} تومان\n`;

    }

  });

  document.getElementById("emailName").value =
    user ? user.name : "مشتری";

  document.getElementById("emailPhone").value =
    user ? user.phone : "ثبت نشده";

  document.getElementById("emailProducts").value =
    productText;

  document.getElementById("emailTotal").value =
    formatPrice(total)+" تومان";

  document.getElementById("orderForm").submit();

}


/* دانلود فاکتور */

function downloadInvoice(){

  const invoice =
    document.getElementById("invoiceArea");

  const text =
    invoice.innerText;

  const blob =
    new Blob(
      [text],
      {type:"text/plain;charset=utf-8"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href=url;

  a.download =
    "فاکتور-بافتنی-هلو.txt";

  a.click();

  URL.revokeObjectURL(url);

}

/* ثبت نام */

function registerUser(){

  const name =
    document.getElementById("nameInput").value.trim();

  const phone =
    document.getElementById("phoneInput").value.trim();

  const password =
    document.getElementById("passwordInput").value.trim();

  if(!name || !phone || !password){

    alert("❌ لطفاً همه قسمت‌ها را پر کنید.");

    return;

  }

  const vip =
    name === "پارسا قلیچ پور" ||
    phone === "۰۹۹۱۵۰۲۳۶۳۲" ||
    phone === "09915023632";

  const user = {
    name:name,
    phone:phone,
    vip:vip
  };

  localStorage.setItem(
    "heloUser",
    JSON.stringify(user)
  );

  closeModal("loginModal");

  updateUserUI();

  alert("🎉 حساب شما با موفقیت ساخته شد!");

}


/* باز کردن ثبت نام */

function openLogin(){

  document.getElementById("loginModal").style.display="flex";

}


/* خروج */

function logoutUser(){

  localStorage.removeItem("heloUser");

  closeModal("accountModal");

  updateUserUI();

  alert("👋 از حساب خارج شدید.");

}


/* نشان حساب */

function updateUserUI(){

  const user =
    JSON.parse(localStorage.getItem("heloUser"));

  const badge =
    document.getElementById("userBadge");

  if(user){

    badge.innerHTML =
      `<div class="vip">
        ${user.vip ? "👑 VIP | " : ""}
        ${user.name}
      </div>`;

  }else{

    badge.innerHTML="";

  }

}


/* نظرات */

function renderComments(id){

  const comments =
    JSON.parse(
      localStorage.getItem("heloComments_"+id)
    ) || [];

  const box =
    document.getElementById("commentsList");

  if(comments.length===0){

    box.innerHTML =
      `<div class="empty">
        هنوز نظری ثبت نشده است. اولین نفر باشید! 💕
      </div>`;

    return;

  }

  box.innerHTML="";

  comments.forEach(comment=>{

    box.innerHTML += `

      <div class="comment-box">

        <div class="comment-name">
          👤 ${comment.name}
        </div>

        <div>
          ${comment.text}
        </div>

      </div>

    `;

  });

}


/* ثبت نظر */

function addComment(){

  if(!currentProduct) return;

  const name =
    document.getElementById("commentName")
    .value.trim();

  const text =
    document.getElementById("commentText")
    .value.trim();

  if(!name || !text){

    alert("❌ نام و متن نظر را وارد کنید.");

    return;

  }

  const key =
    "heloComments_"+currentProduct.id;

  const comments =
    JSON.parse(
      localStorage.getItem(key)
    ) || [];

  comments.push({
    name:name,
    text:text
  });

  localStorage.setItem(
    key,
    JSON.stringify(comments)
  );

  document.getElementById("commentName").value="";
  document.getElementById("commentText").value="";

  renderComments(currentProduct.id);

  alert("✅ نظر شما ثبت شد!");

}


/* بستن مودال */

function closeModal(id){

  document.getElementById(id).style.display="none";

}


/* کلیک بیرون مودال */

window.onclick=function(e){

  if(e.target.classList.contains("modal")){

    e.target.style.display="none";

  }

};


/* شروع */

renderProducts();

updateCartCount();

updateUserUI();
